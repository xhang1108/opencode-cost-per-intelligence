name: refresh-data

on:
  schedule:
    - cron: '23 3 * * *' # 03:23 UTC = 11:23 Asia/Taipei, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Fetch sources and rebuild
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          python scripts/fetch_aa.py
          python scripts/fetch_go.py
          python scripts/fetch_console.py
          python build.py
          python scripts/save_history.py

      - name: Commit data if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'no data change'
          else
            SNAP=$(python -c "import json;print(json.load(open('data/merged.json'))['snapshot_date'])")
            git commit -m "data: refresh snapshot $SNAP"
            git push
          fi
